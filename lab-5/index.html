<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lab-5</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Kształty Lab 5</h1>

    <div class="controls">
      <button id="add-square">Dodaj kwadrat</button>
      <button id="add-circle">Dodaj kółko</button>
      <button id="recolor-squares">Przekoloruj kwadraty</button>
      <button id="recolor-circles">Przekoloruj kółka</button>
    </div>

    <div class="counters">
      Kwadraty: <strong id="count-squares">0</strong> &nbsp;|&nbsp; Kółka:
      <strong id="count-circles">0</strong>
    </div>

    <div id="shapes-list" class="board" aria-label="lista kształtów"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
