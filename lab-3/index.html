<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Koszulki polo</title>
    <link rel="stylesheet" href="css/polo.css" />
  </head>
  <body>
    <input type="radio" name="color" id="blue" checked />
    <input type="radio" name="color" id="red" />
    <input type="radio" name="color" id="green" />
    <input type="radio" name="color" id="yellow" />

    <input type="radio" name="size" id="size-s" />
    <input type="radio" name="size" id="size-m" checked />
    <input type="radio" name="size" id="size-l" />
    <input type="radio" name="size" id="size-xl" />

    <div class="card">
      <div class="image"></div>

      <div class="details">
        <div class="top-info">
          <h2>Koszulka Polo <span class="promo">Promocja!</span></h2>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Quibusdam
            quis adipisci maiores.
          </p>
        </div>

        <div class="middle">
          <div class="option-group">
            <div class="section-title">Kolor</div>
            <div class="colors">
              <label for="blue" style="background: #1e64c8"></label>
              <label for="red" style="background: #d32f2f"></label>
              <label for="green" style="background: #2e7d32"></label>
              <label for="yellow" style="background: #f9b000"></label>
            </div>
          </div>

          <div class="option-group">
            <div class="section-title">Rozmiar</div>
            <div class="sizes">
              <label for="size-s">S</label>
              <label for="size-m">M</label>
              <label for="size-l">L</label>
              <label for="size-xl">XL</label>
            </div>
          </div>
          <p class="price">59,99 zł</p>
          <button class="btn">🛒 Do koszyka</button>
        </div>
      </div>
    </div>
  </body>
</html>
